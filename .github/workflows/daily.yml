name: daily update

on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC = 09:00 JST
  workflow_dispatch:          # 手動実行用
  push:                       # 修正を push したら即反映
    branches: [main]
    paths-ignore:
      - "last-run.txt"        # 実行記録のコミットで再帰しないように

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow

      # 取得済みデータを引き継ぐ（毎回ゼロから取りにいかない）
      - name: restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: dg-cache-${{ github.run_id }}
          restore-keys: dg-cache-

      - name: 古いキャッシュを掃除
        run: find cache -type f -mtime +45 -delete 2>/dev/null || true

      - name: 取得とビルド
        run: python build.py

      # 公開するのはページ本体と画像だけ。Netlify 用の設定や関数は含めない。
      - name: 公開ファイルを揃える
        run: |
          rm -rf _site && mkdir -p _site
          cp deploy/index.html _site/
          cp deploy/og.png     _site/ 2>/dev/null || true
          cp deploy/data.json  _site/ 2>/dev/null || true
          cp -r deploy/th      _site/
          touch _site/.nojekyll
          du -sh _site; ls _site | head

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4

      # 60日間リポジトリに動きがないと GitHub がスケジュールを止めるため、
      # 実行日を1行コミットして活動を残す。
      - name: 実行記録
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "chore: 実行記録 $(date -u +%F)" || exit 0
          git push
